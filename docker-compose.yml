services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-routeguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-routeguard_dev_pw}
      POSTGRES_DB: ${DB_NAME:-routeguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-routeguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      JEV_MODEL: ${JEV_MODEL:-typesafe/jev-1.13}
      SMALL_LLM_MODEL: ${SMALL_LLM_MODEL:-openai/gpt-5.6-luna}
      STRONG_LLM_MODEL: ${STRONG_LLM_MODEL:-openai/gpt-5.6-terra}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-routeguard}
      DB_TEST_NAME: ${DB_TEST_NAME:-routeguard_test}
      DB_USER: ${DB_USER:-routeguard}
      DB_PASSWORD: ${DB_PASSWORD:-routeguard_dev_pw}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
